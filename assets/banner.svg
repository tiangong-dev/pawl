<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">pawl — a language-agnostic anti-regression quality gate</title>
  <desc id="d">A terminal runs `pawl check -q`. Four dimensions report against the recorded baseline: eslint-warnings 342 to 338 better, todo-markers unchanged, line-coverage unchanged, complexity 15 to 18 worse. The gate lists the one regression with the dimension's description, its totals and the file the change came from, then names the dimension that improved and the scoped record command that would lock the gain in. It exits 1.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --hair: #d1d9e0;
      --term-bg: #0d1117;
      --term-bar: #161b22;
      --term-edge: #30363d;
      --term-fg: #e6edf3;
      --dim: #8b949e;
      --good: #3fb950;
      --bad: #f85149;
      --warn: #d29922;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --hair: #2a313c;
        --term-bg: #010409;
        --term-bar: #0d1117;
        --term-edge: #21262d;
      }
    }

    .bg { fill: var(--bg); }
    .wordmark { fill: var(--fg); font: 700 84px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2.5px; }
    .tagline  { fill: var(--muted); font: 400 20px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .badge    { fill: var(--muted); font: 400 16px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tick     { stroke: var(--good); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    /* Exit 1 and exit 2 are different colours because they are different
       claims: one measured a worse number, the other measured nothing. */
    .exits    { fill: var(--muted); font: 400 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .warn     { fill: var(--warn); }

    .term-bg  { fill: var(--term-bg); stroke: var(--term-edge); stroke-width: 1.5; }
    .term-bar { fill: var(--term-bar); }
    .title    { fill: var(--dim); font: 400 14px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* 18px monospace at 0.6em advance = 10.8px per column. Column positions
       below are that grid times the columns `check` actually prints for this
       table — 26, 37, 45, 47, with a 51-character rule. The widths are derived
       from the longest metric id, so they are a property of these four
       dimensions, not a constant. */
    .mono   { font: 400 18px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: var(--good); }
    .cmd    { fill: var(--term-fg); }
    .dimtxt { fill: var(--dim); }
    .head   { fill: var(--dim); }
    .name   { fill: var(--term-fg); }
    .num    { fill: var(--term-fg); }
    .good   { fill: var(--good); }
    .bad    { fill: var(--bad); }

    /* One 14s take. Each line is held from the moment it lands until the whole
       frame fades, so the finished screen — the part that says what pawl does —
       is what a reader sees for most of the loop.

       The loop point sits inside the blank stretch, not at the end of the
       take: every element is opacity 0 at both 0% and 100%, so the restart has
       nothing to jump. Ending on the finished screen instead would snap a full
       terminal back to an empty one in one frame. */
    .cmdline { animation: cmdline 14s linear infinite; }
    .l1 { animation: l1 14s linear infinite; }
    .l2 { animation: l2 14s linear infinite; }
    .l3 { animation: l3 14s linear infinite; }
    .l4 { animation: l4 14s linear infinite; }
    .l5 { animation: l5 14s linear infinite; }
    .l6 { animation: l6 14s linear infinite; }
    .l7 { animation: l7 14s linear infinite; }
    .l8 { animation: l8 14s linear infinite; }
    .l9 { animation: l9 14s linear infinite; }
    .l10 { animation: l10 14s linear infinite; }
    @keyframes cmdline { 0%,  1.9% { opacity: 0 }  2%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l1  { 0%, 13.9% { opacity: 0 } 14%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l2  { 0%, 17.9% { opacity: 0 } 18%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l3  { 0%, 21.9% { opacity: 0 } 22%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l4  { 0%, 25.9% { opacity: 0 } 26%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l5  { 0%, 29.9% { opacity: 0 } 30%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l6  { 0%, 40.9% { opacity: 0 } 41%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l7  { 0%, 44.9% { opacity: 0 } 45%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l8  { 0%, 48.9% { opacity: 0 } 49%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l9  { 0%, 54.9% { opacity: 0 } 55%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l10 { 0%, 58.9% { opacity: 0 } 59%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }

    /* The command types itself: a clip rect widens one character at a time,
       and the caret rides along on the same 15 steps. */
    .typed { animation: typed 14s steps(15, end) infinite; }
    @keyframes typed { 0%, 2% { width: 0 } 10%, 100% { width: 162px } }

    .caret { fill: var(--term-fg); animation: caret-move 14s steps(15, end) infinite, caret-blink 14s steps(1, end) infinite; }
    @keyframes caret-move  { 0%, 2% { transform: translateX(-162px) } 10%, 100% { transform: translateX(0) } }
    @keyframes caret-blink { 0%, 1.9% { opacity: 0 } 2%, 5% { opacity: 1 } 6%, 8% { opacity: 0 } 9%, 11% { opacity: 1 } 12%, 100% { opacity: 0 } }

    /* The regressions header and the title-bar exit code share one pulse,
       because they are one event: the gate refusing to let a number slip back. */
    .alarm { animation: alarm 14s ease-in-out infinite; }
    @keyframes alarm {
      0%, 35.9% { opacity: 0 }
      36%       { opacity: 1 }
      39%       { opacity: .4 }
      42%       { opacity: 1 }
      45%       { opacity: .4 }
      48%, 88%  { opacity: 1 }
      95%, 100% { opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .cmdline,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.l9,.l10,.typed,.caret,.alarm { animation: none; }
      .typed { width: 162px; }
      .caret { opacity: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="520"/>

  <!-- Identity -->
  <text class="wordmark" x="48" y="200">pawl</text>
  <text class="tagline"  x="51" y="242">numbers can only hold or improve</text>

  <g class="tick"><path d="M52 289 l7 7 l13 -14"/></g>
  <text class="badge" x="82" y="296">any language, any metric</text>
  <g class="tick"><path d="M52 327 l7 7 l13 -14"/></g>
  <text class="badge" x="82" y="334">baseline lives in your repo</text>
  <g class="tick"><path d="M52 365 l7 7 l13 -14"/></g>
  <text class="badge" x="82" y="372">one static binary, no server</text>

  <line x1="51" y1="406" x2="330" y2="406" stroke="var(--hair)" stroke-width="1.5"/>
  <text class="exits" x="51" y="434"><tspan class="bad">exit 1</tspan>  something got worse</text>
  <text class="exits" x="51" y="456"><tspan class="warn">exit 2</tspan>  measurement failed</text>

  <!-- Terminal -->
  <rect class="term-bg"  x="372" y="30" width="792" height="460" rx="10"/>
  <path class="term-bar" d="M372 40 a10 10 0 0 1 10 -10 h772 a10 10 0 0 1 10 10 v24 h-792 z"/>
  <line x1="372" y1="64" x2="1164" y2="64" stroke="var(--term-edge)" stroke-width="1.5"/>
  <circle cx="394" cy="47" r="5.5" fill="#ff5f57"/>
  <circle cx="414" cy="47" r="5.5" fill="#febc2e"/>
  <circle cx="434" cy="47" r="5.5" fill="#28c840"/>
  <!-- The exit code is window chrome, not terminal output: a shell prints the
       table and returns 1, it does not print the number. Putting it in the
       title bar keeps the punchline without inventing a line pawl never emits. -->
  <g class="alarm">
    <rect x="1048" y="36" width="92" height="22" rx="11" fill="var(--bad)" fill-opacity=".15" stroke="var(--bad)" stroke-width="1"/>
    <text class="title" x="1094" y="51" text-anchor="middle" fill="var(--bad)" font-weight="600">exit 1</text>
  </g>

  <!-- Row 1: the command, typed. -->
  <clipPath id="typewriter">
    <rect class="typed" x="400" y="86" width="162" height="24"/>
  </clipPath>
  <g class="cmdline" clip-path="url(#typewriter)">
    <text class="mono prompt" x="400" y="104">$ <tspan class="cmd">pawl check -q</tspan></text>
  </g>
  <rect class="caret" x="562" y="88" width="10" height="20"/>

  <!-- Rows 3-4: table header. -->
  <g class="l1">
    <text class="mono head" x="400" y="156">metric</text>
    <text class="mono head" x="681" y="156" text-anchor="end">baseline</text>
    <text class="mono head" x="800" y="156" text-anchor="end">current</text>
    <text class="mono head" x="886" y="156" text-anchor="end">Δ</text>
    <text class="mono head" x="908" y="156">status</text>
    <text class="mono head" x="400" y="182">---------------------------------------------------</text>
  </g>

  <!-- Rows 5-8: one line per dimension. -->
  <g class="l2">
    <text class="mono name" x="400" y="208">eslint-warnings</text>
    <text class="mono num"  x="681" y="208" text-anchor="end">342</text>
    <text class="mono num"  x="800" y="208" text-anchor="end">338</text>
    <text class="mono num"  x="886" y="208" text-anchor="end">-4</text>
    <text class="mono good" x="908" y="208">🎉 better</text>
  </g>
  <g class="l3">
    <text class="mono name"   x="400" y="234">todo-markers</text>
    <text class="mono num"    x="681" y="234" text-anchor="end">12</text>
    <text class="mono num"    x="800" y="234" text-anchor="end">12</text>
    <text class="mono num"    x="886" y="234" text-anchor="end">±0</text>
    <text class="mono dimtxt" x="908" y="234">✅ same</text>
  </g>
  <g class="l4">
    <text class="mono name"   x="400" y="260">line-coverage</text>
    <text class="mono num"    x="681" y="260" text-anchor="end">71.2</text>
    <text class="mono num"    x="800" y="260" text-anchor="end">71.2</text>
    <text class="mono num"    x="886" y="260" text-anchor="end">±0</text>
    <text class="mono dimtxt" x="908" y="260">✅ same</text>
  </g>
  <g class="l5">
    <text class="mono name" x="400" y="286">complexity</text>
    <text class="mono num"  x="681" y="286" text-anchor="end">15</text>
    <text class="mono num"  x="800" y="286" text-anchor="end">18</text>
    <text class="mono num"  x="886" y="286" text-anchor="end">+3</text>
    <text class="mono bad"  x="908" y="286">❌ worse</text>
  </g>

  <!-- Rows 10-13: what regressed, down to the file. -->
  <text class="mono bad alarm" x="400" y="338">❌ regressions:</text>
  <text class="mono name l6"   x="422" y="364">• complexity (cyclomatic complexity per function)</text>
  <text class="mono dimtxt l7" x="465" y="390">total 15 → 18</text>
  <text class="mono dimtxt l8" x="465" y="416">src/parser.ts  9 → 12</text>

  <!-- Rows 14-15: what improved, and the scoped record that locks it in
       without re-blessing the dimensions this run did not touch. -->
  <text class="mono good l9"    x="400" y="442">🎉 improved: eslint-warnings</text>
  <text class="mono dimtxt l10" x="432" y="468">run `pawl record --only eslint-warnings` to lock in the gains.</text>
</svg>
