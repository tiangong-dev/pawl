<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">pawl — a language-agnostic anti-regression quality gate</title>
  <desc id="d">A ratchet rack steps to the left one tooth at a time while a pawl drops into each notch behind it. The measured number falls 342, 337, 331, 328 and never rises.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --rule: #d1d9e0;
      --tooth: #cdd9e5;
      --tooth-edge: #8c9aa8;
      --pawl: #bc8b2c;
      --good: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --rule: #2a313c;
        --tooth: #2d3440;
        --tooth-edge: #6a7684;
        --pawl: #e3b341;
        --good: #3fb950;
      }
    }

    .bg { fill: var(--bg); }
    .wordmark { fill: var(--fg); font: 700 92px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; }
    .tagline { fill: var(--muted); font: 400 23px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: var(--muted); font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; }
    .value { fill: var(--good); font: 600 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rule { stroke: var(--rule); stroke-width: 2; }
    .tooth { fill: var(--tooth); stroke: var(--tooth-edge); stroke-width: 2; stroke-linejoin: round; }
    /* Every fourth tooth is tinted. The teeth repeat every 84px and the rack
       travels 84px per step, so without a marker the motion is invisible: each
       step lands on a frame identical to the one before it. The marker's period
       is 336px, which is exactly the full travel, so the loop still seams. */
    .marked { fill: var(--good); fill-opacity: .22; stroke: var(--good); }
    .arm { fill: var(--pawl); }

    /* The rack only ever travels left: four 84px steps, then the loop restarts
       from a position that is visually identical because the teeth repeat. */
    .rack { animation: rack 12s cubic-bezier(.6,0,.35,1) infinite; }
    @keyframes rack {
      0%,   14% { transform: translateX(0); }
      25%,  39% { transform: translateX(-84px); }
      50%,  64% { transform: translateX(-168px); }
      75%,  89% { transform: translateX(-252px); }
      100%      { transform: translateX(-336px); }
    }

    /* The pawl rides up the ramp of the tooth arriving from the right, then
       drops behind its vertical face. The drop is what makes the step
       irreversible, so it is the fast part of the cycle. */
    .arm { animation: arm 12s cubic-bezier(.6,0,.35,1) infinite; transform-origin: 1000px 116px; }
    @keyframes arm {
      0%,  14% { transform: rotate(0deg); }
      23%      { transform: rotate(13deg); }
      25%, 39% { transform: rotate(0deg); }
      48%      { transform: rotate(13deg); }
      50%, 64% { transform: rotate(0deg); }
      73%      { transform: rotate(13deg); }
      75%, 89% { transform: rotate(0deg); }
      98%      { transform: rotate(13deg); }
      100%     { transform: rotate(0deg); }
    }

    .v0 { animation: v0 12s steps(1, end) infinite; }
    .v1 { animation: v1 12s steps(1, end) infinite; }
    .v2 { animation: v2 12s steps(1, end) infinite; }
    .v3 { animation: v3 12s steps(1, end) infinite; }
    @keyframes v0 { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes v1 { 0%, 24% { opacity: 0 } 25%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes v2 { 0%, 49% { opacity: 0 } 50%, 74% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes v3 { 0%, 74% { opacity: 0 } 75%, 100% { opacity: 1 } }

    /* Anyone who asked the OS to stop moving things gets the end state, which
       is the state that carries the point anyway. */
    @media (prefers-reduced-motion: reduce) {
      .rack, .arm, .v0, .v1, .v2, .v3 { animation: none; }
      .v0, .v1, .v2 { opacity: 0; }
      .v3 { opacity: 1; }
      .rack { transform: translateX(-252px); }
    }
  </style>

  <rect class="bg" width="1200" height="260"/>

  <text class="wordmark" x="72" y="140">pawl</text>
  <text class="tagline" x="76" y="184">numbers can only hold or improve</text>

  <line class="rule" x1="640" y1="52" x2="640" y2="208"/>

  <text class="label" x="700" y="66">FILES OVER 500 LINES</text>
  <text class="value" x="700" y="112">
    <tspan class="v0">342</tspan>
  </text>
  <text class="value" x="700" y="112">
    <tspan class="v1">337</tspan>
  </text>
  <text class="value" x="700" y="112">
    <tspan class="v2">331</tspan>
  </text>
  <text class="value" x="700" y="112">
    <tspan class="v3">328</tspan>
  </text>

  <!-- The rack is clipped so teeth enter and leave cleanly at the panel edge. -->
  <clipPath id="rackWindow">
    <rect x="700" y="128" width="440" height="86"/>
  </clipPath>
  <g clip-path="url(#rackWindow)">
    <g class="rack">
      <!-- One tooth every 84px: a long ramp the pawl can climb, and a vertical
           face it cannot climb back over. Drawn wide enough to cover the full
           travel plus the window. -->
      <path class="tooth marked" d="M700 196 L742 154 L742 196 Z"/>
      <path class="tooth" d="M784 196 L826 154 L826 196 Z"/>
      <path class="tooth" d="M868 196 L910 154 L910 196 Z"/>
      <path class="tooth" d="M952 196 L994 154 L994 196 Z"/>
      <path class="tooth marked" d="M1036 196 L1078 154 L1078 196 Z"/>
      <path class="tooth" d="M1120 196 L1162 154 L1162 196 Z"/>
      <path class="tooth" d="M1204 196 L1246 154 L1246 196 Z"/>
      <path class="tooth" d="M1288 196 L1330 154 L1330 196 Z"/>
      <path class="tooth marked" d="M1372 196 L1414 154 L1414 196 Z"/>
      <path class="tooth" d="M1456 196 L1498 154 L1498 196 Z"/>
      <line class="rule" x1="700" y1="196" x2="1520" y2="196"/>
    </g>
  </g>

  <!-- The pawl: pinned above and to the right, tapering to a hooked tip that
       sits on the rack's baseline with its hook against the vertical face at
       x=910. The hook is the whole mechanism — the ramp side it can climb, this
       side it cannot. -->
  <g class="arm">
    <path d="M991 107 L1009 126 L924 197 L906 197 L914 183 Z"/>
    <circle cx="1000" cy="116" r="13"/>
  </g>
</svg>
