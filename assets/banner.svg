<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
  <title id="t">pawl — the regression gate a coding agent runs on itself</title>
  <desc id="d">A coding agent reports a refactor complete, then runs `pawl check -q`. Four dimensions report against the recorded baseline: eslint-warnings 342 to 338 better, todo-markers unchanged, line-coverage unchanged, complexity 15 to 18 worse. The gate lists the regression down to src/parser.ts, names the dimension that improved and the scoped record that would lock it in, and exits 1 — so the agent withdraws the claim and goes back to the file.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --term-bg: #0d1117;
      --term-bar: #161b22;
      --term-edge: #30363d;
      --term-fg: #e6edf3;
      --dim: #8b949e;
      --good: #3fb950;
      --bad: #f85149;
      --agent: #a371f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --term-bg: #010409;
        --term-bar: #0d1117;
        --term-edge: #21262d;
      }
    }

    .bg { fill: var(--bg); }
    .wordmark { fill: var(--fg); font: 700 84px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2.5px; }
    .tagline  { fill: var(--fg); font: 600 21px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .subtag   { fill: var(--muted); font: 400 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .badge    { fill: var(--muted); font: 400 15px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .badgem   { fill: var(--muted); font: 400 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .tick     { stroke: var(--good); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .term-bg  { fill: var(--term-bg); stroke: var(--term-edge); stroke-width: 1.5; }
    .term-bar { fill: var(--term-bar); }
    .title    { fill: var(--dim); font: 400 14px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* 17px monospace at 0.6em advance = 10.2px per column. The table's column
       positions below are that grid times the columns `check` actually prints
       for this table — 26, 37, 45, 47, with a 51-character rule. Those widths
       are derived from the longest metric id, so they are a property of these
       four dimensions, not a constant. */
    .mono   { font: 400 17px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: var(--good); }
    .cmd    { fill: var(--term-fg); }
    .dimtxt { fill: var(--dim); }
    .head   { fill: var(--dim); }
    .name   { fill: var(--term-fg); }
    .num    { fill: var(--term-fg); }
    .good   { fill: var(--good); }
    .bad    { fill: var(--bad); }
    /* The agent's two turns are the only text here that is not captured CLI
       output, so they are coloured as speech and never sit on the table grid. */
    .agent  { fill: var(--agent); }
    .say    { fill: var(--term-fg); }

    /* One 14s take. Each line is held from the moment it lands until the whole
       frame fades, so the finished screen — the part that says what pawl does —
       is what a reader sees for most of the loop.

       The loop point sits inside the blank stretch, not at the end of the
       take: every element is opacity 0 at both 0% and 100%, so the restart has
       nothing to jump. Ending on the finished screen instead would snap a full
       terminal back to an empty one in one frame. */
    .a1 { animation: a1 14s linear infinite; }
    .cmdline { animation: cmdline 14s linear infinite; }
    .l1 { animation: l1 14s linear infinite; }
    .l2 { animation: l2 14s linear infinite; }
    .l3 { animation: l3 14s linear infinite; }
    .l4 { animation: l4 14s linear infinite; }
    .l5 { animation: l5 14s linear infinite; }
    .l6 { animation: l6 14s linear infinite; }
    .l7 { animation: l7 14s linear infinite; }
    .l8 { animation: l8 14s linear infinite; }
    .l9 { animation: l9 14s linear infinite; }
    .l10 { animation: l10 14s linear infinite; }
    .a2 { animation: a2 14s linear infinite; }
    @keyframes a1      { 0%,  1.9% { opacity: 0 }  2%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes cmdline { 0%,  4.9% { opacity: 0 }  5%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l1  { 0%, 16.9% { opacity: 0 } 17%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l2  { 0%, 20.9% { opacity: 0 } 21%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l3  { 0%, 23.9% { opacity: 0 } 24%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l4  { 0%, 26.9% { opacity: 0 } 27%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l5  { 0%, 29.9% { opacity: 0 } 30%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l6  { 0%, 39.9% { opacity: 0 } 40%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l7  { 0%, 42.9% { opacity: 0 } 43%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l8  { 0%, 45.9% { opacity: 0 } 46%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l9  { 0%, 49.9% { opacity: 0 } 50%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l10 { 0%, 52.9% { opacity: 0 } 53%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes a2  { 0%, 59.9% { opacity: 0 } 60%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }

    /* The command types itself: a clip rect widens one character at a time,
       and the caret rides along on the same 15 steps. */
    .typed { animation: typed 14s steps(15, end) infinite; }
    @keyframes typed { 0%, 5% { width: 0 } 13%, 100% { width: 153px } }

    .caret { fill: var(--term-fg); animation: caret-move 14s steps(15, end) infinite, caret-blink 14s steps(1, end) infinite; }
    @keyframes caret-move  { 0%, 5% { transform: translateX(-153px) } 13%, 100% { transform: translateX(0) } }
    @keyframes caret-blink { 0%, 4.9% { opacity: 0 } 5%, 8% { opacity: 1 } 9%, 11% { opacity: 0 } 12%, 14% { opacity: 1 } 15%, 100% { opacity: 0 } }

    /* The regressions header and the title-bar exit code share one pulse,
       because they are one event: the gate refusing to let a number slip back. */
    .alarm { animation: alarm 14s ease-in-out infinite; }
    @keyframes alarm {
      0%, 35.9% { opacity: 0 }
      36%       { opacity: 1 }
      39%       { opacity: .4 }
      42%       { opacity: 1 }
      45%       { opacity: .4 }
      48%, 88%  { opacity: 1 }
      95%, 100% { opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .a1,.cmdline,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.l9,.l10,.a2,.typed,.caret,.alarm { animation: none; }
      .typed { width: 153px; }
      .caret { opacity: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="590"/>

  <!-- Identity. The four claims are the ones the session on the right cannot
       make for itself: it shows one run, not how an agent comes to run it,
       what it reads back, or what stops it moving the bar instead. -->
  <text class="wordmark" x="40" y="205">pawl</text>
  <text class="tagline"  x="43" y="247">agents assert — pawl measures</text>
  <text class="subtag"   x="43" y="275">numbers can only hold or improve</text>

  <g class="tick"><path d="M44 320 l7 7 l13 -14"/></g>
  <text class="badgem" x="74" y="327">pawl agent-md &gt;&gt; AGENTS.md</text>
  <g class="tick"><path d="M44 358 l7 7 l13 -14"/></g>
  <text class="badge" x="74" y="365">JSON verdict with next_action</text>
  <g class="tick"><path d="M44 396 l7 7 l13 -14"/></g>
  <text class="badge" x="74" y="403">can't measure ≠ measured zero</text>
  <g class="tick"><path d="M44 434 l7 7 l13 -14"/></g>
  <text class="badge" x="74" y="441">it can't lower its own bar</text>

  <!-- The session -->
  <rect class="term-bg"  x="445" y="30" width="719" height="526" rx="10"/>
  <path class="term-bar" d="M445 40 a10 10 0 0 1 10 -10 h699 a10 10 0 0 1 10 10 v24 h-719 z"/>
  <line x1="445" y1="64" x2="1164" y2="64" stroke="var(--term-edge)" stroke-width="1.5"/>
  <circle cx="467" cy="47" r="5.5" fill="#ff5f57"/>
  <circle cx="487" cy="47" r="5.5" fill="#febc2e"/>
  <circle cx="507" cy="47" r="5.5" fill="#28c840"/>
  <!-- The exit code is window chrome, not terminal output: a shell prints the
       table and returns 1, it does not print the number. Putting it in the
       title bar keeps the punchline without inventing a line pawl never emits. -->
  <g class="alarm">
    <rect x="1048" y="36" width="92" height="22" rx="11" fill="var(--bad)" fill-opacity=".15" stroke="var(--bad)" stroke-width="1"/>
    <text class="title" x="1094" y="51" text-anchor="middle" fill="var(--bad)" font-weight="600">exit 1</text>
  </g>

  <!-- The claim. -->
  <text class="mono a1" x="473" y="100"><tspan class="agent">●</tspan> <tspan class="say">Split the long functions in src/parser.ts. Task complete.</tspan></text>

  <!-- The command, typed. -->
  <clipPath id="typewriter">
    <rect class="typed" x="473" y="130" width="153" height="24"/>
  </clipPath>
  <g class="cmdline" clip-path="url(#typewriter)">
    <text class="mono prompt" x="473" y="148">$ <tspan class="cmd">pawl check -q</tspan></text>
  </g>
  <rect class="caret" x="626" y="132" width="10" height="19"/>

  <!-- Everything from here to the improved block is `pawl check -q` verbatim. -->
  <g class="l1">
    <text class="mono head" x="473" y="196">metric</text>
    <text class="mono head" x="738" y="196" text-anchor="end">baseline</text>
    <text class="mono head" x="850" y="196" text-anchor="end">current</text>
    <text class="mono head" x="932" y="196" text-anchor="end">Δ</text>
    <text class="mono head" x="952" y="196">status</text>
    <text class="mono head" x="473" y="220">---------------------------------------------------</text>
  </g>

  <g class="l2">
    <text class="mono name" x="473" y="244">eslint-warnings</text>
    <text class="mono num"  x="738" y="244" text-anchor="end">342</text>
    <text class="mono num"  x="850" y="244" text-anchor="end">338</text>
    <text class="mono num"  x="932" y="244" text-anchor="end">-4</text>
    <text class="mono good" x="952" y="244">🎉 better</text>
  </g>
  <g class="l3">
    <text class="mono name"   x="473" y="268">todo-markers</text>
    <text class="mono num"    x="738" y="268" text-anchor="end">12</text>
    <text class="mono num"    x="850" y="268" text-anchor="end">12</text>
    <text class="mono num"    x="932" y="268" text-anchor="end">±0</text>
    <text class="mono dimtxt" x="952" y="268">✅ same</text>
  </g>
  <g class="l4">
    <text class="mono name"   x="473" y="292">line-coverage</text>
    <text class="mono num"    x="738" y="292" text-anchor="end">71.2</text>
    <text class="mono num"    x="850" y="292" text-anchor="end">71.2</text>
    <text class="mono num"    x="932" y="292" text-anchor="end">±0</text>
    <text class="mono dimtxt" x="952" y="292">✅ same</text>
  </g>
  <g class="l5">
    <text class="mono name" x="473" y="316">complexity</text>
    <text class="mono num"  x="738" y="316" text-anchor="end">15</text>
    <text class="mono num"  x="850" y="316" text-anchor="end">18</text>
    <text class="mono num"  x="932" y="316" text-anchor="end">+3</text>
    <text class="mono bad"  x="952" y="316">❌ worse</text>
  </g>

  <text class="mono bad alarm" x="473" y="364">❌ regressions:</text>
  <text class="mono name l6"   x="493" y="388">• complexity (cyclomatic complexity per function)</text>
  <text class="mono dimtxt l7" x="534" y="412">total 15 → 18</text>
  <text class="mono dimtxt l8" x="534" y="436">src/parser.ts  9 → 12</text>
  <text class="mono good l9"   x="473" y="460">🎉 improved: eslint-warnings</text>
  <text class="mono dimtxt l10" x="504" y="484">run `pawl record --only eslint-warnings` to lock in the gains.</text>

  <!-- The claim, withdrawn. -->
  <text class="mono a2" x="473" y="532"><tspan class="agent">●</tspan> <tspan class="say">Not complete — complexity 15 → 18 in src/parser.ts. Fixing.</tspan></text>
</svg>
