name: 'setup-pawl'
description: 'Quality gate for CI: fail the build when coverage, lint findings, or any tracked number gets worse than the baseline in Git.'
branding:
  icon: 'check-circle'
  color: 'black'

inputs:
  version:
    description: 'Release to install: a tag like v0.1.0, or "latest".'
    required: false
    default: 'latest'
  command:
    description: >-
      Optional pawl command to run after install (e.g. "check"). Left empty,
      the action only installs the binary. Any pre-steps the command needs
      (building exec adapters, etc.) run as ordinary earlier workflow steps.
    required: false
    default: ''
  args:
    description: >-
      Extra arguments for the command, e.g. "--since origin/main". If these
      include -c/--config, the same config is used by guard-ref.
    required: false
    default: ''
  guard-ref:
    description: >-
      Optional git ref whose snapshot must not be weaker than the working tree
      snapshot. Fetch the ref before invoking the action (for example,
      origin/main) to combine check and baseline guard in one standard step.
    required: false
    default: ''
  comment:
    description: >-
      On a pull_request event, upsert a sticky comment with the gate result
      (rendered from the command''s --format json verdict). Default true; set
      "false" to disable. Posting the comment is the only part of this action
      that needs the pull-requests: write permission — with "false", that
      permission can be dropped from the job.
    required: false
    default: 'true'
  token:
    description: 'Token used to post the PR comment. Defaults to the workflow token.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install pawl
      shell: bash
      env:
        PAWL_VERSION: ${{ inputs.version }}
        # Authenticated API calls avoid the unauthenticated rate limit when
        # resolving "latest"; github.token is always available in a workflow.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux)   plat=linux;  ext=tar.gz; bin=pawl ;;
          macOS)   plat=darwin; ext=tar.gz; bin=pawl ;;
          Windows) plat=win32;  ext=zip;    bin=pawl.exe ;;
          *) echo "::error::setup-pawl: unsupported runner OS '$RUNNER_OS'"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::setup-pawl: unsupported runner arch '$RUNNER_ARCH'"; exit 1 ;;
        esac

        ver="$PAWL_VERSION"
        if [ "$ver" = latest ]; then
          ver="$(gh release view --repo tiangong-dev/pawl --json tagName --jq .tagName)"
        fi
        num="${ver#v}"
        asset="pawl-${num}-${plat}-${arch}.${ext}"
        url="https://github.com/tiangong-dev/pawl/releases/download/${ver}/${asset}"

        dest="${RUNNER_TEMP}/pawl-bin"
        mkdir -p "$dest"
        echo "setup-pawl: downloading $asset ($ver)"
        curl -fsSL "$url" -o "${RUNNER_TEMP}/${asset}"
        if [ "$ext" = zip ]; then
          unzip -oq "${RUNNER_TEMP}/${asset}" -d "$dest"
        else
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "$dest"
        fi
        chmod +x "${dest}/${bin}" 2>/dev/null || true
        echo "$dest" >> "$GITHUB_PATH"
        echo "setup-pawl: installed pawl $ver to $dest"

    # Run the gate but capture its exit code instead of failing here, so the
    # comment step still runs on a regression. The verdict is enforced last.
    - name: Run pawl
      id: gate
      if: inputs.command != ''
      shell: bash
      env:
        PAWL_COMMAND: ${{ inputs.command }}
        PAWL_ARGS: ${{ inputs.args }}
      run: |
        # GitHub runs composite bash steps with errexit enabled. Disable it
        # while capturing pawl's verdict so a regression reaches the final
        # enforcement step instead of aborting this setup step.
        set +e
        set -uo pipefail
        report="${RUNNER_TEMP}/pawl-report.json"
        code=0
        # Keep the arguments as an array for the command, and remember a
        # config path so a later guard evaluates the same snapshot/config.
        read -r -a pawl_args <<< "$PAWL_ARGS"
        guard_config=""
        for ((i = 0; i < ${#pawl_args[@]}; i++)); do
          case "${pawl_args[$i]}" in
            -c|--config)
              if (( i + 1 < ${#pawl_args[@]} )); then
                guard_config="${pawl_args[$((i + 1))]}"
                # A post-increment returns status 1 when i is initially 0,
                # which trips the inherited errexit setting on GitHub runners.
                i=$((i + 1))
              fi
              ;;
            --config=*) guard_config="${pawl_args[$i]#--config=}" ;;
          esac
        done
        pawl "$PAWL_COMMAND" --format json "${pawl_args[@]}" > "$report" || code=$?
        echo "report=$report" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "config=$guard_config" >> "$GITHUB_OUTPUT"
        # Mirror the verdict to the log so a failing run still shows it.
        cat "$report" || true

    - name: Guard pawl baseline
      if: inputs.command != '' && inputs.guard-ref != ''
      shell: bash
      env:
        PAWL_GUARD_REF: ${{ inputs.guard-ref }}
        PAWL_CONFIG: ${{ steps.gate.outputs.config }}
      run: |
        set -euo pipefail
        if [ -n "$PAWL_CONFIG" ]; then
          pawl guard --config "$PAWL_CONFIG" "$PAWL_GUARD_REF"
        else
          pawl guard "$PAWL_GUARD_REF"
        fi

    - name: Upsert PR comment
      if: ${{ inputs.command != '' && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        PAWL_REPORT: ${{ steps.gate.outputs.report }}
      # The comment is auxiliary — a startup failure (missing node, bad script)
      # must never fail the job and mask the gate verdict enforced next. It runs
      # after guard so a failed baseline guard cannot leave a green-looking note.
      run: |
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.mjs" || echo "::warning::pawl: PR comment step failed to run"

    - name: Enforce gate verdict
      if: inputs.command != ''
      shell: bash
      env:
        PAWL_CODE: ${{ steps.gate.outputs.code }}
      run: exit "$PAWL_CODE"
