name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel — dev: timestamp-suffix version, npm dist-tag dev, no GitHub Release. release: cli/package.json version, npm dist-tag latest, git tag v<version> + GitHub Release with binary archives.'
        type: choice
        options:
          - dev
          - release
        default: dev

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      npm_tag: ${{ steps.compute.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: compute
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./npm/cli/package.json').version")"
          if [[ "$CHANNEL" == "dev" ]]; then
            # A dev build never carries a bare release version — the timestamp
            # suffix keeps @dev installs strictly newer and never collides with
            # a real release on the registry.
            version="${base%%-*}-dev.$(date -u +%Y%m%d%H%M%S)"
            npm_tag="dev"
          else
            version="$base"
            npm_tag="latest"
          fi
          {
            echo "version=$version"
            echo "npm_tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm provenance attestations (Sigstore); required by
      # `npm publish --provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Cross-compile binaries + build npm packages
        env:
          PAWL_VERSION: ${{ needs.prepare.outputs.version }}
          PAWL_ARCHIVES: '1'
        run: node npm/build.js

      - name: Install cosign
        if: inputs.channel == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing: cosign trades the job's OIDC token (id-token: write,
      # already granted above for npm provenance) for a short-lived cert from
      # Fulcio, and records the signature in Rekor. --bundle writes the
      # signature, certificate, and Rekor entry into one .sigstore.json file
      # next to the archive, so whoever downloads a release can verify it with
      # `cosign verify-blob --bundle <archive>.sigstore.json
      # --certificate-identity-regexp 'https://github.com/tiangong-dev/pawl/\.github/workflows/release\.yml@.*'
      # --certificate-oidc-issuer https://token.actions.githubusercontent.com <archive>`.
      # The identity is scoped to this workflow file, not the whole repo — other
      # workflows here also hold id-token: write, and a bare repo-prefix regex
      # would accept a blob signed by any of them.
      #
      # Runs before the npm publish below: npm publish is irreversible (a
      # version can never be republished), so a transient Fulcio/Rekor/sign
      # failure must be caught before that point — otherwise a retry of this
      # workflow would fail immediately on the already-published version and
      # never reach signing.
      - name: Sign release archives
        if: inputs.channel == 'release'
        run: |
          set -euo pipefail
          for f in npm/dist/archives/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/publish.js

      - name: Upload archives for the release job
        if: inputs.channel == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pawl-archives
          path: npm/dist/archives/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: inputs.channel == 'release'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pawl-archives
          path: archives

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists — bump npm/cli/package.json version before a release run."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

          # Rolling major tag, so `uses: tiangong-dev/pawl@v0` tracks the latest
          # release the way `actions/checkout@v4` does.
          major="v${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

          last="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$last" ]] && git rev-parse --verify "refs/tags/$last" >/dev/null 2>&1; then
            notes="$(git log --pretty=format:'- %s (%h)' "${last}..HEAD")"
            header="## Changes since \`${last}\`"
          else
            notes="$(git log --pretty=format:'- %s (%h)' --max-count=20)"
            header="## Recent commits"
          fi
          [[ -z "$notes" ]] && notes="_No new commits._"
          printf '%s — `npm i -D @pawl-tools/cli@%s`\n\n%s\n\n%s\n' \
            "$header" "$VERSION" "Prebuilt binaries are attached below." "$notes" > /tmp/notes.md

          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md archives/*

      # Nothing about the Marketplace listing is reachable from CI: there is no
      # REST or GraphQL endpoint for the publish tick, so a human has to open the
      # release page. What CI *can* do is say whether this release needs it, which
      # is decided entirely by action.yml — the only file the listing renders.
      - name: Say whether the Marketplace listing needs a tick
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # The tag right below this one in version order — not just "the second
          # newest", so that back-porting a patch compares against its own
          # predecessor rather than whatever happens to sort first.
          prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
            awk -v t="$tag" 'BEGIN { seen = 0 } { if ($0 == t) { seen = 1; next } if (seen) { print; exit } }')"

          if [[ -z "$prev" ]]; then
            verdict="first release — tick it to create the listing"
          elif ! git diff --quiet "$prev" "$tag" -- action.yml; then
            verdict="**required** — \`action.yml\` changed since \`${prev}\`"
          else
            verdict="optional — \`action.yml\` is unchanged since \`${prev}\`"
          fi

          {
            echo "## Marketplace listing: ${verdict}"
            echo
            echo "To tick it: open <https://github.com/tiangong-dev/pawl/releases/edit/${tag}>, check"
            echo "**Publish this Action to the GitHub Marketplace**, set Primary Category to"
            echo "**Code quality** and Another Category to **Continuous integration**, then"
            echo "**Update release**."
            echo
            echo "Skipping it costs nothing to anyone running the action — \`uses:\` resolves a git"
            echo "ref and never consults the Marketplace. The only casualty is"
            echo "<https://github.com/marketplace/actions/setup-pawl>, which keeps showing the"
            echo "name, description, badge and version of the last release that was ticked."
            if [[ -n "$prev" ]] && ! git diff --quiet "$prev" "$tag" -- action.yml; then
              echo
              echo "### What changed in \`action.yml\`"
              echo
              echo '```diff'
              git diff "$prev" "$tag" -- action.yml | tail -n +5
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
