name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # guard-ref compares this PR's CodeQL snapshot with the base branch.
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          output: sarif-results

      # Ratchets CodeQL's own finding count via pawl.codeql.yaml (kept apart
      # from pawl.yaml/ci.yml — see that file's header). A new dimension has
      # no baseline yet, so this reports and passes until someone runs
      # `pawl record -c pawl.codeql.yaml` to lock in a starting point.
      - name: pawl check — CodeQL findings ratchet (${{ matrix.language }})
        uses: ./
        with:
          command: check
          args: '-c pawl.codeql.yaml --only codeql-${{ matrix.language }}'
          guard-ref: origin/${{ github.base_ref || 'main' }}
          comment: 'false'
